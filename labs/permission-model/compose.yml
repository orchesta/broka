name: broka-lab-permission-model

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-19100}:19100"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19100,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-host.docker.internal}:${KAFKA_PORT:-19100}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: &jaas >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:-admin-lab-pass}"
        user_admin="${KAFKA_ADMIN_PASSWORD:-admin-lab-pass}"
        user_svc-checkout="${KAFKA_CHECKOUT_PASSWORD:-checkout-lab-pass}"
        user_svc-orders-reader="${KAFKA_READER_PASSWORD:-reader-lab-pass}";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: *jaas
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: *jaas
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-admin-lab-pass}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="%s";\n' "$$ADMIN_PASSWORD" > /tmp/health.properties &&
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/health.properties > /dev/null 2>&1
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s

  kafka-seed:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-admin-lab-pass}
      CHECKOUT_PASSWORD: ${KAFKA_CHECKOUT_PASSWORD:-checkout-lab-pass}
      READER_PASSWORD: ${KAFKA_READER_PASSWORD:-reader-lab-pass}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/seed-kafka.sh"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3.4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: broka
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-broka-lab-pass}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15720}:15672"
      - "${RABBITMQ_AMQP_PORT:-15721}:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  rabbitmq-seed:
    image: curlimages/curl:8.11.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-broka-lab-pass}
      PAYMENTS_PASSWORD: ${RABBITMQ_PAYMENTS_PASSWORD:-payments-lab-pass}
      ORDERS_PASSWORD: ${RABBITMQ_ORDERS_PASSWORD:-orders-lab-pass}
      DENIED_PASSWORD: ${RABBITMQ_DENIED_PASSWORD:-denied-lab-pass}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/seed-rabbitmq.sh"]
    restart: "no"

volumes:
  kafka-data:
  rabbitmq-data:

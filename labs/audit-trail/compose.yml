# Override for install/compose.yml:
#   docker compose -f ../../install/compose.yml -f compose.yml up -d
# Relative paths resolve from install/, the directory of the first file.
name: broka-lab-audit-trail

services:
  ui:
    ports: !override
      - "${LAB_HTTP_PORT:-3010}:8080"

  # The forwarded copy of the trail, one NDJSON file a day, in a volume the console cannot rewrite.
  orchestrator:
    depends_on:
      forward-init:
        condition: service_completed_successfully
    environment:
      AuditForwarding__Mode: file
      AuditForwarding__Directory: /var/lib/broka/audit-forward
      AuditForwarding__IntervalSeconds: "15"
    volumes:
      - audit-forward:/var/lib/broka/audit-forward

  # The console runs as uid 10001; a new volume belongs to root until this hands it over.
  forward-init:
    image: busybox:1.37.0
    command: ["chown", "10001:10001", "/forward"]
    volumes:
      - audit-forward:/forward
    restart: "no"

  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s

  kafka-seed:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../labs/audit-trail/scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/seed-kafka.sh"]
    restart: "no"

  # The specification's reference CLI, run on demand by the scripts in scripts/.
  cli:
    image: node:22.12.0-alpine
    profiles: ["tools"]
    working_dir: /work
    environment:
      npm_config_cache: /npm-cache
      npm_config_update_notifier: "false"
    volumes:
      - ../labs/audit-trail/evidence:/work
      - ../labs/audit-trail/scripts:/scripts:ro
      - audit-forward:/forwarded:ro
      - npm-cache:/npm-cache

volumes:
  audit-forward:
  kafka-data:
  npm-cache:

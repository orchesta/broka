name: broka-lab-kafka-topics-and-partitions

services:
  # One container is both the broker and the controller, and the only voter of its quorum.
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-19131}:19131"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Fixed, so the cluster keeps the same id on every start.
      CLUSTER_ID: bCyPSXmsT7KNu1MKXkyhGw
      # INTERNAL serves the lab's own containers, EXTERNAL serves clients outside the project, CONTROLLER the quorum.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19131,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-host.docker.internal}:${KAFKA_PORT:-19131}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # The internal topics default to three replicas, which one broker cannot provide.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # What a topic gets when it is created without a partition count or a replication factor.
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      # Topics are created on purpose, by the seed or by you.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s

  seed:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx256m
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/seed.sh"]
    restart: "no"

volumes:
  kafka-data:

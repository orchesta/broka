name: broka

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: broka
      POSTGRES_USER: broka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broka -d broka"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  orchestrator:
    image: ${ORCHESTRATOR_IMAGE:-orchestalabs/broka-orchestrator}:${BROKA_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=broka;Username=broka;Password=${POSTGRES_PASSWORD:?};SSL Mode=${BROKA_DB_SSL_MODE:-prefer}"
      JwtSettings__SecretKey: ${BROKA_JWT_SECRET:?BROKA_JWT_SECRET is required — see .env.example}
      JwtSettings__KeyId: ${BROKA_JWT_KEY_ID:-jwt-1}
      JwtSettings__Previous__0__KeyId: ${BROKA_JWT_PREVIOUS_ID:-}
      JwtSettings__Previous__0__SecretKey: ${BROKA_JWT_PREVIOUS:-}
      Secrets__Kek__ActiveKeyId: ${BROKA_KEK_ID:?BROKA_KEK_ID is required — see .env.example}
      Secrets__Kek__Key: ${BROKA_KEK:?BROKA_KEK is required — see .env.example}
      Secrets__Kek__Previous__0__KeyId: ${BROKA_KEK_PREVIOUS_ID:-}
      Secrets__Kek__Previous__0__Key: ${BROKA_KEK_PREVIOUS:-}
      BrokerServices__Kafka: "http://broker:8081"
      BrokerServices__Redis: "http://broker:8081"
      BrokerServices__Rabbitmq: "http://broker:8081"
      BrokerServices__Artemis: "http://broker:8081"
      BrokerServices__Memcached: "http://broker:8081"
      BrokerServices__ServiceToken: ${BROKA_SERVICE_TOKEN:?BROKA_SERVICE_TOKEN is required — see .env.example}
      LicenceServer__BaseUrl: ${BROKA_LICENCE_SERVER-https://license.broka.dev}
      OpenTelemetry__Prometheus__Enabled: ${BROKA_METRICS_PROMETHEUS:-false}

  broker:
    image: ${BROKER_IMAGE:-orchestalabs/broka-broker}:${BROKA_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy
    environment:
      BROKER_DATABASE_URL: "jdbc:postgresql://postgres:5432/broka?sslmode=${BROKA_DB_SSL_MODE:-prefer}"
      BROKER_DATABASE_USERNAME: broka
      BROKER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?}
      BROKER_SECURITY_KEK_ID: ${BROKA_KEK_ID:?}
      BROKER_SECURITY_KEK: ${BROKA_KEK:?}
      BROKER_SECURITY_PREVIOUS_0_KEK_ID: ${BROKA_KEK_PREVIOUS_ID:-}
      BROKER_SECURITY_PREVIOUS_0_KEK: ${BROKA_KEK_PREVIOUS:-}
      BROKER_SECURITY_SERVICE_TOKEN: ${BROKA_SERVICE_TOKEN:?}
      BROKER_ALERTS_CONSOLE_URL: ${BROKA_PUBLIC_URL-}
      BROKER_KAFKA_KEYSTORE_DIRECTORY: ${BROKA_KEYSTORE_DIR-/etc/broka/keystores}

  ui:
    image: ${UI_IMAGE:-orchestalabs/broka-ui}:${BROKA_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "${BROKA_HTTP_PORT:-3000}:8080"
    environment:
      BROKA_TRUSTED_PROXIES: ${BROKA_TRUSTED_PROXIES:-172.16.0.0/12}

volumes:
  pgdata:
